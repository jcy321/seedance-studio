[tool.poetry]
name = "seedance-studio-backend"
version = "1.0.0"
description = "Seedance Studio - AI Video Creation Platform Backend"
authors = ["Seedance Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic-settings = "^2.6.1"
sqlalchemy = "^2.0.35"
aiosqlite = "^0.20.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.12"
structlog = "^24.4.0"
aiohttp = "^3.9.0"
python-docx = "^1.1.0"
opencv-python = "^4.9.0"
moviepy = "^1.0.3"
anthropic = "^0.40.0"
websockets = "^12.0"
pydantic = {extras = ["email"], version = "^2.13.4"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
black = "^24.10.0"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
